<section class="px-4 lg:px-6 lg:px-10 lg:py-16 py-14 bg-white">
  <div class="bg-[#112a1e] rounded-xl overflow-hidden shadow-2xl flex flex-col lg:flex-row">
    <div class="w-full lg:w-1/3 h-64 lg:h-auto relative">
      <img src="{{missioninfo?.image}}" class="w-full h-full object-cover" alt="Glamping at night" />
      <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <div class="w-full lg:w-2/3 flex flex-col lg:flex-row divide-y lg:divide-y-0 lg:divide-x divide-[#1f4734] p-8 xl:p-14">

      <div class="flex-1 pb-8 lg:pb-0 lg:pr-8">
        <p class="text-white/80 font-semibold text-xs uppercase tracking-widest mb-3" [innerHTML]="missioninfo?.mission_title"></p>
        <h3 class="text-2xl lg:text-3xl font-serif text-white mb-4 leading-snug" [innerHTML]="missioninfo?.mission_heading"></h3>
        <p class="text-gray-300 text-sm leading-relaxed" [innerHTML]="missioninfo?.mission_desc">
        </p>
      </div>

      <div class="flex-1 pt-8 lg:pt-0 lg:pl-8">
        <p class="text-white/80 font-semibold text-xs uppercase tracking-widest mb-3" [innerHTML]="missioninfo?.vision_title"></p>
        <h3 class="text-2xl lg:text-3xl font-serif text-white mb-4 leading-snug" [innerHTML]="missioninfo?.vision_heading"></h3>
        <p class="text-gray-300 text-sm leading-relaxed" [innerHTML]="missioninfo?.vision_desc"></p>
      </div>
    </div>
  </div>
</section>
