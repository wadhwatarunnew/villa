<section class="relative flex flex-col justify-center overflow-hidden bg-cover bg-center bg-no-repeat px-4 md:px-6 lg:px-10 md:min-h-[38rem] min-h-[34rem]" style="background-image: url('{{topSection?.image}}');">
    <div class="absolute inset-0 bg-black/45"></div>

    <div class="relative">
        <div class="max-w-2xl">
            <p class="text-white font-semibold text-sm uppercase mb-3 tracking-widest">
                {{topSection?.subtitle}}
            </p>
            <h1 class="text-white text-4xl md:text-5xl lg:text-6xl leading-[1.3] mb-5" [innerHTML]="topSection?.title">
            </h1>

            <p class="mb-8 text-base leading-relaxed text-gray-200 sm:text-lg" [innerHTML]="topSection?.content">
            </p>

            <div class="flex items-center gap-6">
                @if (topSection?.btn_url) {
                <a class="bg-[#003d1a] hover:bg-[#005b28] text-white px-8 py-3 rounded-md text-[13px] font-medium uppercase transition flex items-center group max-w-max cursor-pointer" routerLink="/{{topSection?.btn_url}}">
            {{topSection?.btn_txt}}
<svg xmlns="http://www.w3.org/2000/svg" class="size-4 ml-2 group-hover:translate-x-1 transition-transform"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
          </a> }
            </div>
        </div>
    </div>
</section>
