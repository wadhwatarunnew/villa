<section class="bg-[#f7f7f5] py-16 border-t border-gray-100">
  <div class="px-4 md:px-6 lg:px-10">
    <div class="grid grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)] gap-3">
      <div
        class="w-full max-w-400 p-4 bg-white border border-gray-200 rounded-md shadow-[0_1px_6px_rgba(0,0,0,0.04)]">
        <h2 class="text-2xl font-serif text-gray-900 mb-3">Our Location</h2>
        <div class="mb-6 h-0.5 w-16 bg-[#006b33]"></div>
        <div class="space-y-4 text-sm text-gray-600 leading-relaxed">
          <div>
            <p class="font-bold text-gray-900 mb-1">{{addressInfo?.heading}}</p>
            <a href="{{addressInfo?.map}}" target="_blank"
              class="text-[#003d1a] hover:underline text-sm font-medium">{{addressInfo?.note}}</a>
          </div>
          <div class="pt-4 border-t border-gray-100">
            <p class="font-semibold text-gray-800 mb-1">Get Directions</p>
            <a href="{{addressInfo?.map}}" target="_blank"
              class="text-[#003d1a] hover:underline text-sm font-medium">Open in Google Maps →</a>
          </div>
        </div>
      </div>

      <div class="rounded-md overflow-hidden border border-gray-200 h-72 lg:h-80">
        <iframe
          *ngIf="googleMapUrl"
          [src]="googleMapUrl"
          width="100%" height="350" frameborder="0" style="border:0" allowfullscreen=""></iframe>
      </div>

    </div>
  </div>
</section>
