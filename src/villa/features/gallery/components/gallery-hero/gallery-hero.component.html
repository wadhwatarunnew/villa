<section
  class="relative md:min-h-[38rem] min-h-[34rem] flex flex-col justify-center bg-cover bg-center bg-no-repeat overflow-hidden rounded-none lg:rounded-none"
  style="background-image: url('{{topSection.image}}');">
  <div class="absolute inset-0 bg-black/45"></div>
  <div class="relative z-10 px-4 md:px-6 lg:px-10 w-full">
    <div>
      <p class="text-white font-semibold text-sm uppercase mb-3 tracking-widest" [innerHTML]="topSection.subtitle"></p>
      <h1 class="text-white text-5xl md:text-6xl !secondary lg:text-[60px]  leading-[1.2] mb-5"
        [innerHTML]="topSection.title">
      </h1>
      <p class="text-white md:text-lg mb-10 max-w-125 leading-relaxed" [innerHTML]="topSection.content">
      </p>
      <div class="flex items-center gap-6">
        @if (topSection.btn_url) {
        <a routerLink="/{{topSection.btn_url}}"
          class="bg-[#003d1a] hover:bg-[#005b28] text-white px-8 py-3 rounded-md text-[13px] font-medium uppercase transition flex items-center group max-w-max cursor-pointer"
          href="/contact">
          {{topSection.btn_txt}}
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4 ml-2 group-hover:translate-x-1 transition-transform"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
        }
      </div>
    </div>
  </div>
</section>
