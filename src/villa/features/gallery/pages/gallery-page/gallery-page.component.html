<villa-gallery-hero [topSection]="TopSection"></villa-gallery-hero>
<section class="px-4 md:px-6 lg:px-10 lg:py-16 py-14" aria-labelledby="projects-title">
  <div class="mx-auto mb-11 max-w-6xl text-center">
    <h2 id="projects-title" class="text-xl font-bold uppercase tracking-widest text-[#007735]" [innerHTML]="GalleryInfo?.title"></h2>
    <div class="mt-4 text-gray-500 leading-7" [innerHTML]="GalleryInfo?.content "></div>
  </div>
</section>

<villa-gallery-filters [tabs]="tabs" [activeTab]="activeTab" (activeTabChange)="setActiveTab($event)">
</villa-gallery-filters>

<villa-gallery-grid [items]="visibleItems" (imageClick)="openLightbox($event)"></villa-gallery-grid>

<div class="flex justify-center px-4 pb-16 sm:px-4 md:px-6 lg:px-10">
  @if (canLoadMore) {
    <button
      type="button"
      (click)="loadMore()"
      class="flex items-center uppercase rounded border border-[#003d1a] bg-[#003d1a] px-8 py-3 text-sm font-semibold text-white transition-colors hover:bg-transparent hover:text-[#003d1a] cursor-pointer">
      load more images
      <span class="material-icons ml-2 flex-shrink-0 text-[18px]">autorenew</span>
    </button>
  }
</div>

@if (lightboxOpen) {
  <villa-gallery-lightbox
    [items]="filteredItems"
    [activeIndex]="activeIndex"
    (closed)="closeLightbox()"
    (activeIndexChange)="setLightboxIndex($event)">
  </villa-gallery-lightbox>
}
