<section class="relative flex min-h-[34rem] w-full items-center bg-cover bg-center bg-no-repeat md:min-h-[38rem]"
  [style.background-image]="'url(' + image + ')'">
  <div class="absolute inset-0 bg-black/45"></div>
  <div class="relative z-10 mx-auto w-full px-4 md:px-6 lg:px-10">
    <div class="max-w-3xl">
      <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-white">— {{ category }}</p>
      <h1 class="mb-6 font-serif text-5xl leading-tight text-white md:text-6xl">{{ project }}</h1>
      <p class="mb-8 max-w-lg text-lg text-white">A bespoke luxury resort tent installation by The Villa Tent, designed to create a remarkable guest experience.</p>
      <a href="/quote" class="group flex w-fit items-center capitalize rounded border border-[#1b402e] bg-[#003d1a] tracking-widest px-8 py-3 text-sm font-medium text-white transition hover:bg-[#005b28]">get a quote <span class="material-icons ml-2 text-base transition-transform group-hover:translate-x-1">arrow_forward</span></a>
    </div>
  </div>
</section>
