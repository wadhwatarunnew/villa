<section class="relative flex min-h-[34rem] w-full items-center bg-cover bg-center bg-no-repeat md:min-h-[38rem]" [style.background-image]="'url(' + topSection.image + ')'">
    <div class="absolute inset-0 bg-black/45"></div>
    <div class="relative z-10 mx-auto w-full px-4 md:px-6 lg:px-10">
        <div class="max-w-3xl">
            <p class="text-white font-semibold text-sm uppercase mb-3 tracking-widest">— {{ topSection.category }}</p>
            <h1 class="text-white text-4xl md:text-5xl lg:text-6xl leading-[1.3] mb-5">{{ topSection.title }}</h1>
            <div class="mb-8 max-w-lg text-lg text-white" [innerHTML]="topSection.banner_desc"></div>
            <a routerLink="/get-a-quote" class="bg-[#003d1a] hover:bg-[#005b28] text-white px-8 py-3 rounded-md text-[13px] font-medium uppercase transition flex items-center group max-w-max cursor-pointer">get
        a quote <svg xmlns="http://www.w3.org/2000/svg"
          class="size-4 ml-2 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg></a>
        </div>
    </div>
</section>
