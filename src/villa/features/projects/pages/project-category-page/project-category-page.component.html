<main class="bg-[#faf9f6]">
  <section class="relative flex min-h-120 items-center bg-cover bg-center px-6 py-14 lg:px-10"
    [style.background-image]="'url(' + category.image + ')'">
    <div class="absolute inset-0 bg-black/45"></div>
    <div class="relative">
      <h1 class="mt-4 max-w-3xl font-serif text-4xl text-white md:text-5xl">{{ category.name }}</h1>
      <p class="mt-3 text-white/90">A selection of our completed luxury resort tent projects.</p>
    </div>
  </section>
  <section class="px-6 py-16 lg:px-10">
    <div class="mb-8 flex items-center justify-between">
      <p class="text-sm text-gray-500"><b class="text-[#005b28]">{{ category.projects.length }}</b> projects available
      </p><a routerLink="/projects" class="text-xs font-bold uppercase tracking-wider text-[#005b28]">← All
        categories</a>
    </div>
    <div class="grid grid-cols-1 gap-4.5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"><a
        *ngFor="let project of category.projects; let i = index" [routerLink]="['/projects', category.slug, routeSlug(project)]"
        class="group overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg"><img
          [src]="images[i % images.length].image" [alt]="project" class="aspect-[1.45] w-full object-cover"
          loading="lazy">
        <div class="p-4">
          <h2 class="text-base font-bold leading-snug text-[#1f2937] tracking-wide">{{ project }}</h2>
          <p class="mt-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-[#005b28]">View
            details <span class="material-icons">arrow_forward</span></p>
        </div>
      </a></div>
  </section>
</main><villa-common-cta></villa-common-cta>
