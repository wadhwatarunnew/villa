<main>
    <villa-project-detail-hero [topSection]="this.data?.Data?.Data"></villa-project-detail-hero>
    <section id="project-gallery" class="px-4 md:px-6 lg:px-10 lg:py-16 py-14">
        <div class="grid gap-6 lg:grid-cols-[1fr_.82fr_1.2fr] lg:gap-10">
            <article>
                <p class="text-[13px] font-bold uppercase tracking-widest text-[#003d1a]">{{ProjectDetails?.subtitle}}</p>
                <p class="mt-5 text-sm leading-7 text-gray-600" [innerHTML]="ProjectDetails?.content">
                </p>
                <a routerLink="/quote"
                    class="mt-8 inline-flex items-center gap-3 rounded bg-[#003d1a] px-7 py-3 text-xs font-bold uppercase text-white transition hover:bg-[#005b28]">Enquire about similar project <span class="material-icons text-base">arrow_forward</span></a>
            </article>
            <article class="divide-y divide-gray-200 bg-[#faf9f6] px-4 py-3 shadow-sm">
                <div class="flex gap-4 py-5" *ngFor="let info of ProjectInfo">
                    <span class="material-icons text-[#007735]">{{info.icon}}</span>
                    <div>
                        <b class="block text-sm text-[#0e2614]">{{info.title}}</b>
                        <span class="text-sm text-gray-500">{{info.description}}</span>
                    </div>
                </div>
            </article>
            <article>
                <div class="relative overflow-hidden rounded-lg bg-black shadow-lg">
                    <img [src]="gallery[activeIndex]" class="aspect-[1.4] w-full object-cover">
                    <button (click)="previous()" class="absolute cursor-pointer left-3 top-1/2 grid size-10 -translate-y-1/2 place-items-center rounded-full bg-white/90 text-[#003d1a]">
                        <span class="material-icons text-2xl">chevron_left</span>
                    </button>
                    <button (click)="next()" class="absolute cursor-pointer right-3 top-1/2 grid size-10 -translate-y-1/2 place-items-center rounded-full bg-white/90 text-[#003d1a]">
                        <span class="material-icons text-2xl">chevron_right</span>
                    </button>
                    <button (click)="isFullscreen=true" class="absolute cursor-pointer right-3 top-3 grid size-9 place-items-center rounded-full bg-black/50 text-white">
                        <span class="material-icons text-lg">fullscreen</span>
                    </button>
                </div>
                
                <div class="flex gap-3 overflow-x-auto pt-3"><button type="button" *ngFor="let image of gallery; let i = index"
                (click)="select(i)" class="shrink-0 overflow-hidden rounded-md border-2"
                [class.border-green-500]="activeIndex === i" [class.border-transparent]="activeIndex !== i"><img
                    class="h-20 w-32 object-cover" [src]="image" [alt]="name + ' thumbnail'" /></button></div>
            </article>
        </div>
    </section>

    <villa-project-challenge-solution [challenges]="Challenges" [solutions]="Solutions" [projectDetails]="ProjectDetails"></villa-project-challenge-solution>
    <section *ngIf="OtherProjects?.length > 1" class="bg-white px-4 md:px-6 lg:px-10 lg:py-16 py-14">
        <div class="mb-6 flex items-end justify-between">
            <div>
                <p class="text-[13px] font-bold uppercase tracking-widest text-[#003d1a]">More to explore</p>
                <h2 class="mt-2 font-serif text-3xl text-[#0e2614]">More {{ ProjectDetails.category }}</h2>
            </div>
            <div class="flex gap-2">
                <button (click)="scroll(slider,-1)" class="grid cursor-pointer size-10 place-items-center rounded-full border border-gray-200 text-[#005b28] hover:bg-[#005b28] bg-[#faf9f6] hover:text-white">
                    <span class="material-icons">chevron_left</span>
                </button>
                <button (click)="scroll(slider,1)" class="grid cursor-pointer size-10 place-items-center rounded-full border border-gray-200 text-[#005b28] hover:bg-[#005b28] bg-[#faf9f6] hover:text-white">
                    <span class="material-icons">chevron_right</span>
                </button>
            </div>
        </div>
        <div #slider class="flex gap-5 overflow-hidden scroll-smooth pb-3 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden"><a *ngFor="let item of OtherProjects; let i=index"
                [routerLink]="['/', item.slug]"
                class="w-[290px] shrink-0 overflow-hidden rounded-lg border border-gray-200 bg-[#faf9f6]">
                <img [src]="item.image" [alt]="item.title" class="aspect-[1.65] w-full object-cover">
                <h3 class="p-4 font-bold text-[#1f2937]">{{ item.title }}</h3>
            </a></div>
    </section>
</main><villa-common-cta></villa-common-cta>
<div *ngIf="isFullscreen" class="fixed inset-0 z-[100] flex flex-col bg-black/90 p-5 text-white md:p-8">
    <div class="flex items-center justify-between">
        <span class="text-lg font-medium">{{ activeIndex + 1 }} / {{
            gallery.length }}</span>
        <button type="button" (click)="isFullscreen = false" class="grid size-11 place-items-center rounded-full bg-white/10 hover:bg-white/20">
            <span class="material-icons">close</span>
        </button>
    </div>

    <div class="relative flex flex-1 items-center justify-center py-5">
        <img [src]="gallery[activeIndex]" [alt]="project"
        class="max-h-[calc(100vh-14rem)] max-w-[78vw] rounded-xl object-contain shadow-2xl">
        <button type="button"
        (click)="previous()"
        class="absolute left-0 grid size-12 place-items-center rounded bg-white/15 hover:bg-white/25 cursor-pointer"><span
            class="material-icons text-3xl">chevron_left</span>
        </button>
        
        <button type="button" (click)="next()"
        class="absolute right-0 grid size-12 place-items-center rounded bg-white/15 hover:bg-white/25 cursor-pointer"><span
            class="material-icons text-3xl">chevron_right</span>
        </button>
    </div>

    <div class="flex gap-3 overflow-x-auto pt-3">
        <button type="button" *ngFor="let image of gallery; let i = index"
        (click)="select(i)" class="shrink-0 overflow-hidden rounded-md border-2"
        [class.border-green-500]="activeIndex === i" [class.border-transparent]="activeIndex !== i">
        <img class="h-20 w-32 object-cover" [src]="image" [alt]="project + ' thumbnail'" />
        </button>
    </div>
</div>
