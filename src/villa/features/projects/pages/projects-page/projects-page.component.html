<section class="relative flex min-h-[34rem] px-4 md:px-6 lg:px-10 lg:py-16 py-14 flex-col justify-center overflow-hidden bg-cover bg-center bg-no-repeat md:min-h-[38rem]"
  style="background-image:url('{{topSection?.image}}')">
  <div class="absolute inset-0 bg-black/45"></div>
  <div class="relative max-w-3xl">
    <p class="text-white font-semibold text-sm uppercase mb-3 tracking-widest" [innerHTML]="topSection?.subtitle"></p>
    <h1 class="text-white text-4xl md:text-5xl lg:text-6xl font-serif leading-[1.3] mb-5" [innerHTML]="topSection?.title"></h1>
    <p class="mt-5 mb-8 max-w-125 text-white md:text-lg leading-relaxed" [innerHTML]="topSection?.content"></p>
      <div class="flex items-center gap-6">
      @if(topSection?.btn_url != '') {
        <a
          class="bg-[#003d1a] hover:bg-[#005b28] text-white px-8 py-3 rounded-md text-[13px] font-medium uppercase transition flex items-center group max-w-max cursor-pointer" href="/{{topSection?.btn_url}}">
          {{topSection?.btn_txt}}
          <span class="material-icons ml-3 group-hover:translate-x-1 transition-transform flex-shrink-0">arrow_forward</span>
        </a>
      }
    </div>
  </div>
</section>

<section class="px-4 md:px-6 lg:px-10 py-16" aria-labelledby="projects-title">
  <div class="mx-auto mb-11 max-w-3xl text-center">
    <p class="text-sm font-bold uppercase tracking-widest text-[#007735]">Our portfolio</p>
    <h2 id="projects-title" class="mt-3 font-serif text-4xl text-[#0e2614]" [innerHTML]="projectData?.title"></h2>
    <p class="mt-4 text-gray-500" [innerHTML]="projectData?.content"></p>
  </div>
  <div class="mx-auto grid max-w-5xl gap-4.5 md:grid-cols-2">
    <a *ngFor="let category of categories" [routerLink]="['/', category.slug]"
      class="group overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
      <img [src]="category.image" [alt]="category.name" class="aspect-[1.7] w-full object-cover" />
      <div class="flex items-center justify-between p-6">
        <div>
          <p class="text-[13px] tracking-wide font-bold uppercase text-[#007735]">{{ category.total }} projects
          </p>
          <h2 class="mt-2 text-xl font-bold text-[#0e2614]">{{ category.name }}</h2>
        </div><span class="material-icons text-[#007735]">arrow_forward</span>
      </div>
    </a>
  </div>
</section>
<villa-projects-highlight></villa-projects-highlight>
<villa-common-cta></villa-common-cta>
