<section class="relative flex items-center bg-cover bg-center text-white px-4 md:px-6 lg:px-10 lg:py-16 py-14 min-h-120"
  [style.background-image]="'url(' + topSection.image + ')'">
  <div class="absolute inset-0 bg-black/45"></div>
  <div class="relative">
    <h1 class="font-serif text-4xl md:text-5xl" [innerHTML]="topSection.title"></h1>
    <p class="mt-3 max-w-2xl text-white md:text-lg leading-relaxed" [innerHTML]="topSection.short_desc"></p>
    </div>
</section>
