<section class="px-4 md:px-6 lg:px-10 lg:py-16 py-14">
  <div class="grid gap-8 lg:grid-cols-2 lg:items-start">
    <villa-tent-image-gallery [name]="tentDetails.title" [images]="images"></villa-tent-image-gallery>
    <div class="py-2 flex flex-col justify-center h-full">
      <p class="text-[13px] font-bold uppercase tracking-widest text-[#003d1a]">{{ tentDetails.category}}</p>
      <h1 class="mt-3 font-serif text-4xl text-[#0e2614] md:text-5xl" [innerHTML]="tentDetails.title"></h1>
      <p class="mt-4 max-w-xl leading-relaxed text-gray-600" [innerHTML]="tentDetails.content"></p>
      <div class="md:my-7 mt-7 grid grid-cols-2 gap-x-5 gap-y-6 border-y border-gray-200 py-6 xl:grid-cols-4">
        @for (tentInfo of quickInfo; track tentInfo.title) {
          <div class="flex items-center gap-3">
            <span class="material-icons text-[#007735]" aria-hidden="true">
              {{ tentInfo.icon }}
            </span>

            <div>
              <b class="block text-[11px] uppercase text-gray-500">
                {{ tentInfo.title }}
              </b>

              <span class="text-sm font-semibold text-[#0e2614]">
                {{ tentInfo.description }}
              </span>
            </div>
          </div>
        }

      </div>
      <div class="flex items-center gap-3">
          <a routerLink="/download-brochure">
            <button class="hidden 2xl:flex px-6 py-2 text-[13px] font-medium cursor-pointer border border-[#003d1a] text-black hover:text-white hover:bg-[#003d1a] rounded-md transition-all duration-200 shadow-lg items-center gap-2 uppercase">
              download brochure
              <span class="material-icons flex-shrink-0 !text-2xl" aria-hidden="true">file_download</span>
            </button>
          </a>

          <a routerLink="/quote"
            class="hidden 2xl:flex px-6 py-2 text-[13px] font-medium text-white bg-[#003d1a] border border-[#[#003d1a]] hover:bg-[#005b28] rounded-md transition-all duration-200 shadow-lg items-center gap-2 uppercase">
            Enquire Now
            <span class="material-icons flex-shrink-0 !text-2xl" aria-hidden="true">arrow_forward</span>
          </a>
        </div>
    </div>
  </div>
</section>
