<section class="bg-[#faf9f6] px-4 md:px-6 lg:px-10 lg:py-16 py-14">
    <div class="grid gap-6 lg:grid-cols-2">
      <div class="bg-white sm:px-6 px-4 py-8 rounded-lg shadow-sm">
        <p class="mb-6 font-semibold uppercase text-[#0a3d2d] tracking-wider">
          Features &amp; Benefits
        </p>

        <div class="grid xl:grid-cols-2 xl:gap-6 gap-5">
          <div *ngFor="let item of tentDetails.Features" class="flex items-start gap-4">
            <div class="flex size-10 shrink-0 items-center justify-center rounded-full border-[2px] border-[#0a3d2d]/70 text-[#0a3d2d]">
              <span class="material-icons text-[2.3rem]">{{ item.icon }}</span>
            </div>

            <div class="min-w-0">
              <h3 class="font-serif text-lg font-bold leading-tight text-[#0a3d2d]">
                {{ item.title }}
              </h3>
              <p class="mt-2 text-[15px] text-[#29362e]">
                {{ item.description }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white sm:px-6 px-4 py-8 rounded-lg shadow-sm">
        <p class="mb-6 font-semibold uppercase text-[#0a3d2d] tracking-wider">
          Materials &amp; Construction
        </p>

        <div class="relative pl-10 before:absolute before:left-[18px] before:top-2 before:bottom-2 before:w-px before:border-l-2 before:border-dotted before:border-[#0a3d2d]/70">
          <div *ngFor="let item of tentDetails.Materials; let last = last" class="relative pb-7 pl-4 last:pb-0">
            <div class="absolute -left-10 top-1 flex h-9 w-9 items-center justify-center rounded-full border border-[#0a3d2d]/80 bg-white text-[#0a3d2d]">
              <span class="material-icons text-[1.1rem]">{{ item.icon }}</span>
            </div>

            <div class="min-w-0">
              <p class="font-semibold text-[#0a3d2d]">
                {{ item.title }}
              </p>
              <p class="text-[15px] text-[#29362e]">
                {{ item.description }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
</section>
