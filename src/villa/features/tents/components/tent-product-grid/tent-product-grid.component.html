<section id="tent-collections" class="px-4 py-14 md:px-6 lg:px-10 lg:py-16" aria-labelledby="collections-title">
    <div class="mx-auto mb-10 text-left">
        <p class="mb-3 text-sm font-bold uppercase tracking-widest text-[#007735]">Our collection</p>
        <div class="leading-relaxed text-gray-500" [innerHTML]="topSection?.content"></div>
    </div>
    <div class="mb-7 flex items-center justify-between">
        <p class="text-gray-500 capitalize"><b class="text-[#005b28]">{{ tents.length }}</b> tents available</p><a routerLink="/resort-tent" class="text-xs font-bold uppercase text-[#005b28]">← All collections</a>
    </div>
    <div class="grid grid-cols-1 gap-4.5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <article class="cursor-pointer overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg" *ngFor="let tent of visiblePosts; let i = index" [routerLink]="['/', tent.slug]">
            <img class="aspect-[1.45] w-full object-cover" src="{{ tent.image }}" [alt]="tent.name" loading="lazy" />
            <div class="p-4">
                <h2 class="text-lg font-bold capitalize text-[#1f2937]">{{ tent.name }}</h2>
                <p class="mt-1 text-sm text-gray-500">Premium {{ tent.category }}</p>
                <a [routerLink]="['/', tent.slug]" class="mt-3 text-xs flex items-center gap-2 font-semibold uppercase text-[#005b28]">View
                    details <span class="material-icons">arrow_forward</span></a>
            </div>
        </article>
    </div>

    @if(hasMorePosts) {
    <div class="mt-10 flex justify-center">
        <button type="button" (click)="loadMore()" class="flex items-center uppercase rounded border border-[#003d1a] bg-[#003d1a] px-8 py-3 text-sm font-semibold text-white transition-colors hover:bg-transparent hover:text-[#003d1a] cursor-pointer">Load
                more <span class="material-icons ml-2 flex-shrink-0 text-[18px]">autorenew</span></button>
    </div>
    }
</section>
