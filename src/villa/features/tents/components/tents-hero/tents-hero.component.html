<section class="relative flex min-h-[34rem] flex-col justify-center overflow-hidden bg-cover bg-center bg-no-repeat md:min-h-[38rem]"
  style="background-image: url('{{resortData.image}}');" aria-labelledby="tents-hero-title">
  <div class="absolute inset-0 bg-black/45"></div>
  <div class="relative z-10 mx-auto w-full px-4 md:px-6 lg:px-10">
    <div class="max-w-3xl">
      <p class="text-white font-semibold text-sm uppercase mb-3 tracking-widest">— Premium Luxury Tents</p>
      <h1 id="tents-hero-title" class="text-white text-4xl md:text-5xl lg:text-6xl font-serif leading-tight mb-5" [innerHTML]="resortData?.title">
      </h1>
      <p class="mb-8 max-w-125 text-white md:text-lg leading-relaxed" [innerHTML]="resortData?.content">
      </p>
      <div class="flex items-center gap-6">
        <a href="/contact-us"
          class="bg-[#003d1a] hover:bg-[#005b28] text-white px-8 py-3 rounded-md text-[13px] font-medium uppercase transition flex items-center group max-w-max cursor-pointer" href="/contact-us">
          contact us
          <span class="material-icons ml-3 group-hover:translate-x-1 transition-transform flex-shrink-0" aria-hidden="true">arrow_forward</span>
        </a>
      </div>
    </div>
  </div>
</section>
